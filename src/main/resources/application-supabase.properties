# Supabase PostgreSQL — run: ./gradlew bootRun --args='--spring.profiles.active=supabase'
# Set password via env: export SPRING_DATASOURCE_PASSWORD=your-password

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.vqhhguzjtkcahhtjllrs.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
