# Supabase Session/Transaction Pooler for Render (IPv4)
# Project: vqhhguzjtkcahhtjllrs | Region: ca-central-1
#
# Render env vars (Session pooler — recommended for Spring/Hibernate):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres.vqhhguzjtkcahhtjllrs
#   SPRING_DATASOURCE_PASSWORD=your-password
#
# Transaction pooler (6543): add prepareThreshold=0 to URL, or rely on application.properties Hikari setting.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
