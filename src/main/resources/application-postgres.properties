# PostgreSQL profili — istifade: ./gradlew bootRun --args='--spring.profiles.active=postgres'
# Evvelce PostgreSQL-de DB yaradin: CREATE DATABASE masterfix;

spring.datasource.url=jdbc:postgresql://localhost:5432/masterfix
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
