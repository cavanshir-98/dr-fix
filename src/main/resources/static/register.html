<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DrFix — Sign Up</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="auth-topbar">
    <div class="container auth-topbar-inner">
        <a href="/" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">DrFix</span></a>
        <nav class="auth-tabs scroll-tabs">
            <a href="/" class="tab">Home</a>
            <a href="/register.html" class="tab active">Sign Up</a>
            <a href="/account/login.html" class="tab">Sign In</a>
            <a href="/account.html" class="tab">My Bookings</a>
        </nav>
    </div>
</header>

<div class="auth-page">
    <div class="auth-card">
        <h1>Sign Up</h1>
        <p class="sub">Create an account to book services and view your bookings</p>

        <div id="feedback" class="alert" hidden></div>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">

            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required placeholder="+1 (555) 123-4567" autocomplete="tel">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">

            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required autocomplete="new-password">

            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <p class="auth-links">
            Already have an account? <a href="/account/login.html">Sign in</a><br>
            <a href="/">← Back to home</a>
        </p>
    </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const feedback = document.getElementById('feedback');
    feedback.hidden = true;

    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.success) {
            window.location.href = '/account/login.html?registered=1';
            return;
        }

        const msg = json.errors
            ? Object.values(json.errors).flat().join(', ')
            : json.message;
        feedback.textContent = msg;
        feedback.className = 'alert alert-error';
        feedback.hidden = false;
    } catch (err) {
        feedback.textContent = 'Registration failed. Please try again.';
        feedback.className = 'alert alert-error';
        feedback.hidden = false;
    }
});
</script>
<script src="/js/auth.js"></script>
<script>redirectIfAuthenticated();</script>
</body>
</html>
