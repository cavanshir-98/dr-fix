<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DrFix — Admin Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Admin Login</h1>
        <p class="sub">Admin panel only (view all bookings)</p>

        <div id="errorBox" class="alert alert-error" hidden>Invalid username or password.</div>
        <div id="logoutBox" class="alert alert-ok" hidden>You have been signed out.</div>

        <form method="post" action="/login/admin">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="btn btn-primary" type="submit">Sign In</button>
        </form>

        <a class="back-home" href="/">← Back to home</a>
    </div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    if (params.has('error')) document.getElementById('errorBox').hidden = false;
    if (params.has('logout')) document.getElementById('logoutBox').hidden = false;
</script>
</body>
</html>
