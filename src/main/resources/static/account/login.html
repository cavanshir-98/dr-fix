<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DrFix — Customer Sign In</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="auth-topbar">
    <div class="container auth-topbar-inner">
        <a href="/" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">DrFix</span></a>
        <nav class="auth-tabs scroll-tabs">
            <a href="/" class="tab">Home</a>
            <a href="/register.html" class="tab">Sign Up</a>
            <a href="/account/login.html" class="tab active">Sign In</a>
            <a href="/account.html" class="tab">My Bookings</a>
        </nav>
    </div>
</header>

<div class="auth-page">
    <div class="auth-card">
        <h1>Customer Sign In</h1>
        <p class="sub">Sign in to view your bookings</p>

        <div id="errorBox" class="alert alert-error" hidden>Invalid email or password.</div>
        <div id="registeredBox" class="alert alert-ok" hidden>Registration successful. You can sign in now.</div>

        <form method="post" action="/login/customer">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="btn btn-primary" type="submit">Sign In</button>
        </form>

        <div class="auth-card-actions">
            <a href="/register.html" class="btn btn-outline">Create Account</a>
        </div>

        <p class="auth-links">
            <a href="/">← Back to home</a>
        </p>
    </div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    if (params.has('error')) document.getElementById('errorBox').hidden = false;
    if (params.has('registered')) document.getElementById('registeredBox').hidden = false;
</script>
<script src="/js/auth.js"></script>
<script>redirectIfAuthenticated();</script>
</body>
</html>
