<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DrFix — Bookings</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
<header class="navbar scrolled" id="navbar">
    <div class="container nav-inner">
        <a href="/" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">DrFix</span></a>
        <nav class="compact-nav-links" aria-label="Admin navigation">
            <a href="/">Home</a>
            <a href="/admin.html" class="active">Bookings</a>
        </nav>
        <div class="nav-actions">
            <a class="btn btn-ghost btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</header>

<main class="admin-wrap">
    <h1>Bookings</h1>
    <p class="sub">All bookings (newest first)</p>
    <div class="admin-toolbar">
        <button class="btn btn-primary btn-sm" onclick="loadBookings()">Refresh</button>
        <span id="countLabel"></span>
        <span class="spacer"></span>
        <a class="btn btn-outline btn-sm" href="/logout">Logout</a>
    </div>
    <div id="bookingsRoot">
        <p class="account-empty">Loading...</p>
    </div>
</main>

<script>
async function loadBookings() {
    const root = document.getElementById('bookingsRoot');
    root.innerHTML = '<p class="account-empty">Loading...</p>';
    try {
        const res = await fetch('/api/bookings', { credentials: 'same-origin' });
        if (res.status === 401 || res.status === 403) {
            window.location.href = '/login.html';
            return;
        }
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Failed');
        const rows = json.data || [];
        document.getElementById('countLabel').textContent = rows.length + ' booking(s)';
        if (!rows.length) {
            root.innerHTML = '<p class="account-empty">No bookings yet.</p>';
            return;
        }
        root.innerHTML = `
            <table class="bookings-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Customer</th>
                        <th>Date / Time</th>
                        <th>Address</th>
                        <th>Service</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(b => `
                        <tr>
                            <td data-label="Code"><strong>${escapeHtml(b.confirmationCode)}</strong></td>
                            <td data-label="Customer">
                                ${escapeHtml(b.fullName)}<br>
                                <small>${escapeHtml(b.phone)} · ${escapeHtml(b.email)}</small>
                            </td>
                            <td data-label="Date / Time">${b.preferredDate ? escapeHtml(b.preferredDate) : 'To be scheduled'}<br><small>${b.preferredTime ? escapeHtml(b.preferredTime) : ''}</small></td>
                            <td data-label="Address">${escapeHtml(b.address)}, ${escapeHtml(b.city)}, ${escapeHtml(b.state)} ${escapeHtml(b.zipCode || '')}</td>
                            <td data-label="Service">
                                ${escapeHtml(b.applianceType)}
                                ${b.description ? `<br><small>${escapeHtml(b.description)}</small>` : ''}
                            </td>
                            <td data-label="Status"><span class="badge">${escapeHtml(b.status || '')}</span></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    } catch (e) {
        root.innerHTML = '<p class="account-empty">Failed to load bookings. Is the server running?</p>';
    }
}

function escapeHtml(str) {
    return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

loadBookings();
</script>
</body>
</html>
