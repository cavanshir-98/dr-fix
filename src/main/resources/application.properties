spring.application.name=masterfix
spring.config.import=optional:file:.env.local

server.port=${PORT:8080}

# Database — on Render + Supabase use Session Pooler (see application-supabase.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masterfix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
# Required for Supabase Transaction pooler (port 6543) — avoids "prepared statement already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# WhatsApp owner number (digits only, country code included)
whatsapp.owner.phone=13124389034

# --- Option A: Telegram (recommended, free, easy) ---
# 1. Telegram -> @BotFather -> /newbot -> copy token
# 2. Start chat with your bot, send any message
# 3. Open: https://api.telegram.org/bot<TOKEN>/getUpdates -> find "chat":{"id":123456}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

# --- Option B: WhatsApp via CallMeBot ---
# https://www.callmebot.com/blog/free-api-whatsapp-messages/
whatsapp.callmebot.apikey=

# --- Booking email (same text as WhatsApp notification) ---
booking.notification.email.to=${BOOKING_NOTIFICATION_EMAIL:cavansir.asad@gmail.com}
booking.notification.email.from=${BOOKING_NOTIFICATION_EMAIL_FROM:Drfixrepairappliancerepair@gmail.com}
booking.notification.email.from-name=DrFix

# Option 1: Gmail SMTP (Render env: SPRING_MAIL_PASSWORD = Gmail App Password)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:Drfixrepair@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Option 2: Resend API (Render env: RESEND_API_KEY) — https://resend.com
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:DrFix <onboarding@resend.dev>}

# Option 3: Brevo API (Render env: BREVO_API_KEY) — https://www.brevo.com
brevo.api.key=${BREVO_API_KEY:}

# Admin login (change these before production)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:masterfix123}
