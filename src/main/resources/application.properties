spring.application.name=masterfix

server.port=${PORT:8080}

# Database — on Render + Supabase use Session Pooler (see application-supabase.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masterfix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
# Required for Supabase Transaction pooler (port 6543) — avoids "prepared statement already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# WhatsApp owner number (digits only, country code included)
whatsapp.owner.phone=13124389034

# --- Option A: Telegram (recommended, free, easy) ---
# 1. Telegram -> @BotFather -> /newbot -> copy token
# 2. Start chat with your bot, send any message
# 3. Open: https://api.telegram.org/bot<TOKEN>/getUpdates -> find "chat":{"id":123456}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

# --- Option B: WhatsApp via CallMeBot ---
# https://www.callmebot.com/blog/free-api-whatsapp-messages/
whatsapp.callmebot.apikey=

# Admin login (change these before production)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:masterfix123}
