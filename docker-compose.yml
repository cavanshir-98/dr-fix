services:
  postgres:
    image: postgres:16-alpine
    container_name: masterfix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: masterfix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - masterfix_pg_data:/var/lib/postgresql/data

volumes:
  masterfix_pg_data:
