name: Keep Render awake

on:
  schedule:
    # Every 10 minutes (Render free tier sleeps after ~15 min idle)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -fsS --max-time 120 "https://dr-fix.onrender.com/" > /dev/null
          echo "Ping OK at $(date -u)"
